meta:
  name: lean-base
  description: Lean 4 development with the Lean language server and the Lean FRO skills.
  long_description: |
    For anyone writing Lean 4, whether programs or proofs. It connects the assistant to Lean's
    language server, so it reads the real goal state and diagnostics instead of guessing them,
    and it sets a short discipline for Lean work: check after every edit, look names up rather
    than recall them, fix linter warnings rather than silence them, and never leave a `sorry`
    unreported. Skills set up and run the project's linters and weave its Verso literate site,
    and the Lean FRO skills (proof method, MWEs, toolchain bisection, Lean and Mathlib
    contribution conventions) come fetched from their own repository. It builds on
    `general-dev`, so the language-agnostic workflow habits come with it.
  version: "0.1.0"
  author: bugcounting.net

# Extends general-dev like the other language stacks: its workflow rules apply to Lean as
# they stand, and its context7 server is one of the lookups the `lean` rule names.
extends: ../general-dev

rules:
  - name: lean
    category: lean-dev

# The Lean FRO skills are fetched from their repository rather than copied here, pinned to
# one commit so a deploy is reproducible. Bump the SHA to take upstream changes; `boff check`
# then reports which skills changed until the next deploy.
skills:
  - lean-lint
  - lean-weave
  - name: lean-proof
    from: &lean-fro https://github.com/leanprover/skills/tree/7d3da0282e7b724b07620e45cf212f2e05e19334/skills
  - { name: lean-mwe, from: *lean-fro }
  - { name: lean-bisect, from: *lean-fro }
  - { name: lean-setup, from: *lean-fro }
  - { name: lean-pr, from: *lean-fro }
  - { name: mathlib-build, from: *lean-fro }
  - { name: mathlib-pr, from: *lean-fro }
  - { name: mathlib-review, from: *lean-fro }
  - { name: nightly-testing, from: *lean-fro }

mcp_servers:
  - lean-lsp

# Antigravity has no established permission format, so every entry names the platforms
# that take it rather than warn on each antigravity deploy.
permissions:
  allow:
    - { tool: bash, pattern: "lake build", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lake build *", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lake query *", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lake env lean *", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lake lint", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lake lint *", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lean --version", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lake --version", available_on: [claude, opencode] }
    - { tool: mcp, pattern: "lean-lsp", available_on: [claude] }
