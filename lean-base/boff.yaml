meta:
  name: lean-base
  description: Lean 4 development with the Lean language server and the Lean FRO skills.
  long_description: |
    For anyone writing Lean 4, whether programs or proofs. It connects the assistant to Lean's
    language server, so it reads the real goal state and diagnostics instead of guessing them,
    and it sets a short discipline for Lean work: check after every edit, look names up rather
    than recall them, and never leave a `sorry` unreported. A skill builds the project and
    weaves its Verso literate site, and on Claude Code the Lean FRO skills plugin comes linked
    by reference.
  version: "0.1.0"
  author: bugcounting.net

# Deliberately extends nothing, so it stacks beside whichever baseline a project already
# deploys. The `lean` rule names context7 as one way to look a name up: that server comes
# from commons-dev, so deploy the two together to have it.

rules:
  - name: lean
    category: lean-dev

skills:
  - lean-weave

mcp_servers:
  - lean-lsp

# Antigravity has no established permission format, so every entry names the platforms
# that take it rather than warn on each antigravity deploy.
permissions:
  allow:
    - { tool: bash, pattern: "lake build", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lake build *", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lake query *", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lake env lean *", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lean --version", available_on: [claude, opencode] }
    - { tool: bash, pattern: "lake --version", available_on: [claude, opencode] }
    - { tool: mcp, pattern: "lean-lsp", available_on: [claude] }

# Link the Lean FRO skills by reference instead of copying them: Claude Code offers to
# install the marketplace plugin when the workspace is trusted.
settings:
  claude:
    extraKnownMarketplaces:
      leanprover:
        source:
          source: github
          repo: leanprover/skills
    enabledPlugins:
      lean@leanprover: true
